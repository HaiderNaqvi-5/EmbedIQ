[project]
name = "embediq-backend"
version = "0.1.0"
description = "Backend for EmbedIQ RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1,<2.0.0",
    "pgvector>=0.2.5,<1.0.0",
    "celery[redis]>=5.3.6,<6.0.0",
    "redis>=5.0.3,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.1.0,<6.0.0",
    "playwright>=1.42.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<4.1.0",
    "python-multipart>=0.0.9",
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
